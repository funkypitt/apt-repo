# Rebuilds the apt repository from the latest GitHub releases and publishes it on GitHub Pages.
# Runs every day, and on demand (gh workflow run update.yml). The signing key is the
# APT_SIGNING_KEY secret (ASCII-armored private key, no passphrase).
name: update
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: [repos.txt, build.sh, index.html]
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
      - name: import signing key
        run: |
          mkdir -p ~/gnupg && chmod 700 ~/gnupg
          printf '%s' "$APT_SIGNING_KEY" | gpg --homedir ~/gnupg --batch --import
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      - run: GPG_HOMEDIR=~/gnupg ./build.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pool dists funkypitt.gpg funkypitt.asc .nojekyll
          # The Release file changes every run (its date); only commit when a package did.
          git diff --cached --quiet -- pool dists/stable/main funkypitt.gpg && echo "nothing new" && exit 0
          git commit -m "update: $(grep ^Package: dists/stable/main/binary-amd64/Packages | wc -l) packages, $(date -u +%F)"
          git push
